<div class="editor-container">
  ${Body}

  <template id="Home">
    <div class="editor-layout">
      <div class="editor-header">
        <div class="header-left">
          <h1 class="title is-4 mb-0">swmlang Playground</h1>
        </div>
        <div class="header-center">
          <div class="select">
            <select onchange="${LoadExample}">
              <option value="" disabled selected>Load Example...</option>
              <option value="0">HI!</option>
              <option value="1">Stars</option>
              <option value="2">XO</option>
              <option value="3">Multiply</option>
            </select>
          </div>
        </div>
        <div class="header-right">
          <button onclick="${RunCode}" class="button is-success is-medium">
            <span class="icon"><i>&gt;</i></span>
            <span>Run</span>
          </button>
          <button onclick="${ClearOutput}" class="button is-light is-medium">Clear</button>
        </div>
      </div>

      <div class="editor-panels">
        <div class="editor-panel">
          <div class="panel-header">
            <span class="panel-title">Code Editor</span>
            <span class="panel-hint">.swm</span>
          </div>
          <div class="panel-content">
            <textarea class="textarea is-family-monospace" placeholder="Enter swmlang code here..." bind="${Code}"></textarea>
          </div>
        </div>

        <div class="editor-panel">
          <div class="panel-header">
            <span class="panel-title">Terminal</span>
          </div>
          <div class="panel-content output-panel">${Output}</div>
        </div>
      </div>

      <div class="editor-footer">
        <details class="example-section">
          <summary>Syntax</summary>
          <div class="doc-content">
            <div class="doc-section">Variables</div>
            <div class="doc-item"><strong>이번에 [X] (정원 N) 을 개설했습니다</strong> declares or resets a local variable.</div>
            <div class="doc-item"><strong>[X] 신청 바랍니다</strong> increments, <strong>[X] 한자리 남았습니다</strong> decrements.</div>
            <div class="doc-item"><strong>[X] 잔여 N명입니다</strong>, <strong>[X] N자리 남았습니다</strong>, <strong>[X] N명 부족합니다</strong> assign values.</div>
            <div class="doc-section">Output</div>
            <div class="doc-item"><strong>[X] 많은 관심 부탁드립니다</strong> writes <code>X &amp; 0xFF</code> as a character.</div>
            <div class="doc-item"><strong>[X] 현재 인원 공유드립니다</strong> writes the integer value.</div>
            <div class="doc-section">Control Flow</div>
            <div class="doc-item"><strong>[X] 아직 마감되지 않아 한번 더 공지드립니다</strong> starts a while loop; <strong>참고 부탁드립니다</strong> closes it.</div>
            <div class="doc-item"><strong>[X] 인원 미달이라</strong> runs when X is zero; <strong>인원이 미달이더라도</strong> is else.</div>
            <div class="doc-section">Functions</div>
            <div class="doc-item"><strong>안녕하세요 함수명 멘토입니다</strong> starts a function definition.</div>
            <div class="doc-item"><strong>멘토 소개: https://notion.so/...</strong> defines base64 parameter defaults.</div>
            <div class="doc-item"><strong>https://swmaestro.ai/...</strong> calls a function.</div>
            <div class="doc-item"><strong>[X] 마감되었습니다. 감사합니다!</strong> returns X, or exits at top-level.</div>
          </div>
        </details>
      </div>
    </div>
  </template>
</div>
